<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상추 스마트팜 무음 카메라</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 16px; text-align: center; }
    video { width: 100%; max-width: 480px; border: 1px solid #333; border-radius: 8px; }
    button { font-size: 16px; padding: 12px 20px; margin: 8px; border-radius: 6px; border: none; background: #28a745; color: #fff; font-weight: bold; }
    #log { margin-top: 12px; font-size: 13px; color: #aaa; white-space: pre-line; }
  </style>
</head>
<body>
  <h3>Lettuce-Lab 무음 정각 카메라</h3>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div>
    <button onclick="captureAndSend()" style="background:#007bff;">지금 1장 테스트 업로드</button>
  </div>
  <div id="log">정각(08:00, 12:00, 16:00, 20:00) 자동 감시 중...</div>

  <script>
    const TARGET_HOURS = new Array(8, 12, 16, 20);
    let lastUploadedKey = "";

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        document.getElementById("video").srcObject = stream;
        log("후면 카메라 연결 완료 (0dB 무음 모드)");
      } catch (e) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        document.getElementById("video").srcObject = stream;
        log("후면 카메라 연결 완료");
      }
    }

    function log(msg) {
      const now = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      document.getElementById("log").innerText = `[${now}] ${msg}\n` + document.getElementById("log").innerText.slice(0, 400);
    }

    function getJSTParts() {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
      return {
        hour: now.getHours(),
        min: now.getMinutes(),
        key: `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}_${now.getHours()}`
      };
    }

    function captureAndSend() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL("image/jpeg", 0.75).split(",").pop();
      log("무음 캡처 완료 -> 단축어 업로드 전송!");
      window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent("업로드") + "&input=text&text=" + encodeURIComponent(base64Data);
    }

    setInterval(() => {
      const { hour, min, key } = getJSTParts();
      if (TARGET_HOURS.includes(hour) && min === 0 && lastUploadedKey !== key) {
        lastUploadedKey = key;
        captureAndSend();
      }
    }, 10000);

    initCamera();
  </script>
</body>
</html>
