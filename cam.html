<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상추 스마트팜 무인 카메라</title>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 16px; text-align: center; }
    video { width: 100%; max-width: 480px; border: 1px solid #333; border-radius: 8px; }
    button { font-size: 16px; padding: 12px 18px; margin: 6px; border-radius: 6px; border: none; color: #fff; font-weight: bold; background: #007bff; }
    #log { margin-top: 10px; font-size: 13px; color: #aaa; white-space: pre-line; }
  </style>
</head>
<body>
  <h3>Lettuce-Lab 무음 정각 카메라</h3>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <textarea id="clip" style="position:fixed; left:-9999px;"></textarea>
  <div>
    <button onclick="captureToClipboard()">지금 1장 수동 캡처</button>
  </div>
  <div id="log">카메라 준비 중...</div>

  <script>
    let isCameraReady = false;

    async function initCamera() {
      const video = document.getElementById("video");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (e) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
      }
      video.onloadeddata = () => {
        setTimeout(() => {
          isCameraReady = true;
          log("후면 카메라 예열 완료 (0dB 무음 준비됨)");
          if (location.search.includes("auto=1")) {
            captureToClipboard();
          }
        }, 1500);
      };
    }

    function log(msg) {
      const now = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      document.getElementById("log").innerText = `[${now}] ${msg}\n` + document.getElementById("log").innerText.slice(0, 400);
    }

    function captureToClipboard() {
      const video = document.getElementById("video");
      if (!isCameraReady || video.videoWidth === 0) {
        setTimeout(captureToClipboard, 1500);
        return;
      }
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoHeight;
      canvas.height = video.videoWidth;
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.drawImage(video, -video.videoWidth / 2, -video.videoHeight / 2);

      const base64Data = canvas.toDataURL("image/jpeg", 0.75).split(",").pop();
      const box = document.getElementById("clip");
      box.value = base64Data;
      box.select();
      document.execCommand("copy");
      log("0dB 무음 캡처 및 클립보드 복사 완료!");
    }

    initCamera();
  </script>
</body>
</html>
